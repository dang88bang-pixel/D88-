name: D88 Build

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.console=plain"

jobs:
  build:
    name: Unit Tests + Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (Wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (reine JVM-Kernlogik)
        run: set -o pipefail; ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee d88-test.log

      - name: Build debug APK
        if: success()
        run: set -o pipefail; ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee -a d88-test.log

      - name: Fehler-Auszug (nur bei Fehler)
        if: failure()
        continue-on-error: true
        run: |
          {
            echo "## D88 Build – Fehler-Auszug (Gradle)"
            echo '```'
            (grep -nE "^e: |error:|FAILED|What went wrong|Caused by|Unresolved reference|> Task .* FAILED|Execution failed|Could not" d88-test.log | head -60) || true
            echo "---- letzter Kontext (120 Zeilen) ----"
            (tail -n 120 d88-test.log) || true
            echo '```'
          } > d88-failure.md || true
          CR=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[0].check_run.id' 2>/dev/null) || CR=""
          if [ -n "$CR" ]; then
            MSG=$(head -c 60000 d88-failure.md)
            gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs/$CR/annotations" \
              -F "path=build" -F "start_line=1" -F "end_line=1" \
              -F "annotation_level=failure" -F "message=$MSG" || echo "Annotation fehlgeschlagen"
            echo "Fehler-Auszug als Check-Annotation gepostet (CR $CR)"
          else
            echo "Keine Check-Run-ID gefunden; Auszug liegt in d88-failure.md"
            cat d88-failure.md
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d88-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d88-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  release:
    name: Release (signiert NUR mit Secrets – sonst sauber übersprungen)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (Wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        id: check
        run: |
          if [ -z "$SECRET_B64" ]; then
            echo "D88_RELEASE_KEystore_BASE64 fehlt → Release-Signing wird übersprungen."
            echo "Es wird KEIN Key generiert und KEIN Fake-Signing vorgenommen."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SECRET_B64: ${{ secrets.D88_RELEASE_KEystore_BASE64 }}

      - name: Build signed release APK
        if: steps.check.outputs.signed == 'true'
        env:
          D88_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          D88_KEYSTORE_PASS: ${{ secrets.D88_RELEASE_KEystore_PASSWORD }}
          D88_KEY_ALIAS: ${{ secrets.D88_RELEASE_KEY_ALIAS }}
          D88_KEY_PASS: ${{ secrets.D88_RELEASE_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.D88_RELEASE_KEystore_BASE64 }}" | base64 -d > release.keystore
          ./gradlew :app:assembleRelease --stacktrace

      - name: Upload signed release APK
        if: steps.check.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: d88-release-apk-signed
          path: app/build/outputs/apk/release/app-release.apk

      - name: Status ohne Signing
        if: steps.check.outputs.signed != 'true'
        run: |
          echo "## Release übersprungen"
          echo "Signing-Secrets fehlen. Aktueller belastbarer Stand: Debug-APK aus dem Build-Job."
          >> "$GITHUB_STEP_SUMMARY"
