name: D88 Build

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.console=plain"

jobs:
  build:
    name: Unit Tests + Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (Wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (reine JVM-Kernlogik)
        run: set -o pipefail; ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee d88-test.log

      - name: Build debug APK
        if: success()
        run: set -o pipefail; ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee -a d88-test.log

      - name: Fehler-Auszug (nur bei Fehler)
        if: failure()
        run: |
          {
            echo "## D88 Build – Fehler-Auszug (Gradle)"
            echo '```'
            grep -nE "^e: |error:|FAILED|What went wrong|Caused by|Unresolved reference|> Task .* FAILED|Execution failed" d88-test.log | head -60
            echo "---- letzter Kontext ----"
            tail -n 40 d88-test.log
            echo '```'
          } > d88-failure.md
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          token = os.environ["GITHUB_TOKEN"]
          # Check-Run-ID des aktuellen Jobs holen
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(req) as r:
              jobs = json.load(r)["jobs"]
          check_run_id = jobs[0].get("check_run", {}).get("id")
          if not check_run_id:
              print("Keine Check-Run-ID gefunden"); raise SystemExit(0)
          text = open("d88-failure.md").read()[:60000]
          payload = json.dumps({"output": {
              "title": "D88 Build fehlgeschlagen – Fehler-Auszug",
              "summary": text,
              "text": text
          }}).encode()
          patch = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/check-runs/{check_run_id}",
              data=payload, method="PATCH",
              headers={"Authorization": f"Bearer {token}",
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          with urllib.request.urlopen(patch) as r:
              print("Fehler-Auszug in Check-Run geschrieben, HTTP", r.status)
          PY

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d88-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d88-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  release:
    name: Release (signiert NUR mit Secrets – sonst sauber übersprungen)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (Wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        id: check
        run: |
          if [ -z "$SECRET_B64" ]; then
            echo "D88_RELEASE_KEystore_BASE64 fehlt → Release-Signing wird übersprungen."
            echo "Es wird KEIN Key generiert und KEIN Fake-Signing vorgenommen."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SECRET_B64: ${{ secrets.D88_RELEASE_KEystore_BASE64 }}

      - name: Build signed release APK
        if: steps.check.outputs.signed == 'true'
        env:
          D88_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          D88_KEYSTORE_PASS: ${{ secrets.D88_RELEASE_KEystore_PASSWORD }}
          D88_KEY_ALIAS: ${{ secrets.D88_RELEASE_KEY_ALIAS }}
          D88_KEY_PASS: ${{ secrets.D88_RELEASE_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.D88_RELEASE_KEystore_BASE64 }}" | base64 -d > release.keystore
          ./gradlew :app:assembleRelease --stacktrace

      - name: Upload signed release APK
        if: steps.check.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: d88-release-apk-signed
          path: app/build/outputs/apk/release/app-release.apk

      - name: Status ohne Signing
        if: steps.check.outputs.signed != 'true'
        run: |
          echo "## Release übersprungen"
          echo "Signing-Secrets fehlen. Aktueller belastbarer Stand: Debug-APK aus dem Build-Job."
          >> "$GITHUB_STEP_SUMMARY"
